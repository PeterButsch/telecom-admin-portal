spring:
  application:
    name: telecom-demo-backend
  datasource:
    # APP_DB_PATH overrides the database file; the default is relative to the working directory (backend/).
    # foreign_keys=true makes SQLite enforce the REFERENCES clauses in the schema.
    # date_class=TEXT stores timestamps as "yyyy-MM-dd HH:mm:ss.SSS" (UTC), the same format the seed script
    # writes. The driver default (epoch millis) breaks range filters, because SQLite sorts integers before text.
    # journal_mode=WAL lets readers continue while a write is in progress.
    url: jdbc:sqlite:${APP_DB_PATH:app.db}?foreign_keys=true&busy_timeout=5000&date_class=TEXT&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      # Staff are signed out after this much inactivity.
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        name: TELCO_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIES:false}

app:
  max-request-bytes: 1048576
  demo-data:
    # Fills an empty database with generated Singapore demo data on startup,
    # and creates one demo staff account per role with this password.
    enabled: ${APP_DEMO_DATA:true}
    seed: 42
    staff-password: ${APP_DEMO_PASSWORD:Demo-Pass-2026}
  security:
    # Set APP_SECURE_COOKIES=true when the portal is served over HTTPS.
    secure-cookies: ${APP_SECURE_COOKIES:false}
    max-failed-logins: 5
    lockout-minutes: 15
    # Creates an "admin" account with this password when no staff accounts exist and demo data is off.
    bootstrap-admin-password: ${APP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
